<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Klub — Raja Nobar Indonesia</title>
<link rel="icon" type="image/png" href="images/logo-rajanobar.png" />
<style>
  :root {
    --nav: #17311f;
    --nav-line: rgba(242, 247, 241, 0.12);
    --pitch: #0f1f14;
    --pitch-deep: #081209;
    --gold: #d4ab52;
    --gold-tint: #f3d98b;
    --red: #dc2430;
    --navy: #16213d;
    --ink: #12201a;
    --ink-muted: #5c6b60;
    --paper: #ffffff;
    --line: #e7ebe4;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #f2f7f1;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    background: var(--pitch-deep);
    max-width: 480px;
    margin-inline: auto;
    padding-bottom: calc(4.4rem + var(--safe-b));
    position: relative;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  img { max-width: 100%; }

  /* ---------- Top bar ---------- */
  .top-bar {
    background: var(--nav);
    border-bottom: 1px solid var(--nav-line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.8rem 1rem;
    gap: 0.8rem;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .top-bar .logo img { height: 1.6rem; width: auto; display: block; }
  .top-actions { display: flex; align-items: center; gap: 0.6rem; }
  .icon-btn {
    width: 2.3rem; height: 2.3rem; border-radius: 0.65rem;
    border: 1px solid var(--nav-line);
    background: rgba(242, 247, 241, 0.04);
    display: flex; align-items: center; justify-content: center;
    color: #f2f7f1;
  }

  /* ---------- Secondary sport tabs ---------- */
  .sub-nav {
    background: var(--paper);
    display: flex;
    align-items: center;
    padding: 0 0.9rem;
    overflow-x: auto;
    color: var(--ink);
    scrollbar-width: none;
  }
  .sub-nav::-webkit-scrollbar { display: none; }
  .sub-nav a {
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0.85rem 0.75rem;
    font-size: 0.8rem; font-weight: 700;
    color: #57614f;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    flex: none;
  }
  .sub-nav a.active { color: var(--ink); border-bottom-color: var(--red); }
  .sub-nav a .soon {
    font-size: 0.56rem; font-weight: 800; color: var(--red);
    vertical-align: super; margin-left: 0.1rem;
  }

  /* ---------- Running text ticker ---------- */
  .ticker {
    background: var(--gold-tint);
    color: var(--ink);
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    height: 2rem;
  }
  .ticker-track {
    position: absolute;
    display: flex;
    align-items: center;
    height: 100%;
    gap: 2rem;
    padding-left: 2rem;
    animation: scroll-left 16s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; }
  }
  .ticker-track span {
    font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
    font-weight: 800;
    font-size: 0.8rem;
    text-transform: uppercase;
  }
  .ticker-track span.hot { color: var(--red); }
  @keyframes scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ---------- Club header (light section) ---------- */
  .club-hero {
    background: var(--paper);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    padding: 1.5rem 1rem 1.8rem;
  }
  .club-hero-illustration {
    position: absolute;
    top: 0.6rem;
    right: 0.5rem;
    left: 0.5rem;
    display: flex;
    justify-content: space-between;
    padding: 0 1.2rem;
    opacity: 0.55;
    pointer-events: none;
  }
  .club-hero h1 {
    position: relative;
    font-size: 1.9rem; font-weight: 800; margin: 0 0 0.4rem;
  }
  .club-hero p {
    position: relative;
    font-size: 0.88rem; color: var(--ink-muted); margin: 0 0 1.2rem;
  }
  .club-search {
    position: relative;
    display: flex; align-items: center; gap: 0.6rem;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.85rem 1.1rem;
    box-shadow: 0 6px 18px rgba(18,32,26,0.06);
  }
  .club-search svg { flex: none; color: #9aa79e; }
  .club-search input {
    border: none; outline: none; font: inherit; font-size: 0.92rem;
    color: var(--ink); width: 100%; background: none;
  }
  .club-search input::placeholder { color: #9aa79e; }

  /* ---------- Empty state ---------- */
  .club-empty {
    background: var(--paper);
    color: var(--ink);
    text-align: center;
    padding: 3rem 1.5rem 3.4rem;
  }
  .club-empty svg { margin-bottom: 1rem; color: #c7d0c9; }
  .club-empty p { font-size: 0.92rem; color: var(--ink-muted); margin: 0; }

  /* ---------- Community note ---------- */
  .community-note {
    margin: 1.2rem 1rem 0;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: rgba(212, 171, 82, 0.1);
    border: 1px solid var(--gold);
    border-radius: 1rem;
    padding: 1rem 1.1rem;
  }
  .community-note .ic {
    flex: none;
    width: 2.4rem; height: 2.4rem; border-radius: 50%;
    background: var(--gold);
    color: #3a2b09;
    display: flex; align-items: center; justify-content: center;
  }
  .community-note h3 { font-size: 0.92rem; font-weight: 800; margin: 0 0 0.15rem; }
  .community-note p { font-size: 0.8rem; color: #b9c8bd; margin: 0; }

  /* ---------- Bottom tab bar ---------- */
  .tab-bar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: 100%;
    max-width: 480px;
    background: var(--nav);
    border-top: 1px solid var(--nav-line);
    display: flex;
    padding: 0.55rem 0.3rem calc(0.55rem + var(--safe-b));
    z-index: 6;
  }
  .tab-bar a {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 0.28rem;
    font-size: 0.66rem; font-weight: 700;
    color: #8fa392;
    padding: 0.25rem 0;
    border-radius: 0.6rem;
  }
  .tab-bar a.active { color: #fff; background: rgba(220, 36, 48, 0.16); }
  .tab-bar a .ic { width: 1.3rem; height: 1.3rem; }
</style>
</head>
<body>

<header class="top-bar">

  <div class="top-actions">
